name: Monthly Cards Update

on:
  schedule:
    # Runs at 02:00 UTC on the 1st of every month
    - cron: "0 2 1 * *"
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r lorcana-data/requirements.txt

      - name: Run main.py
        run: .venv/bin/python lorcana-data/main.py

      - name: Replace old zip and bump version
        run: |
          # Remove the old .json.zip artifact if it still exists
          rm -f lorcana_cards_update.json.zip

          # Bump the version number in lorcana_cards_version
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("lorcana_cards_version")
          data = json.loads(p.read_text())
          data["version"] += 1
          p.write_text(json.dumps(data, indent=4) + "\n")
          print(f"Version bumped to {data['version']}")
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lorcana_cards_update.zip lorcana_cards_update.json lorcana_cards_version
          git rm --cached lorcana_cards_update.json.zip 2>/dev/null || true
          git commit -m "Auto-update cards: $(date -u +'%a %b %e %T UTC %Y')" || echo "No changes to commit"
          git push
