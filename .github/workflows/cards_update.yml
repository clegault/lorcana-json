name: Daily Cards Update

on:
  schedule:
    # Runs at 19:45 UTC every day, ahead of the 20:15 price update so new
    # cards are in the zip that getprices.py matches promos against
    - cron: "45 19 * * *"
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r lorcana-data/requirements.txt

      - name: Run main.py
        # --refresh-lorcanito pulls current abilities so new sets aren't blank
        run: .venv/bin/python lorcana-data/main.py --refresh-lorcanito

      - name: Bump version and commit if cards changed
        run: |
          # main.py leaves the zip untouched when the card data is identical
          if git diff --quiet -- lorcana_cards_update.json.zip; then
            echo "Cards unchanged; nothing to commit"
            exit 0
          fi

          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("lorcana_cards_version")
          data = json.loads(p.read_text())
          data["version"] += 1
          p.write_text(json.dumps(data, indent=4) + "\n")
          print(f"Version bumped to {data['version']}")
          PY

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lorcana_cards_update.json.zip lorcana_cards_version lorcana-data/lorcanito.json
          git commit -m "Auto-update cards: $(date -u +'%a %b %e %T UTC %Y')"
          git pull --rebase
          git push
